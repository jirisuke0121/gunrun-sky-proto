name: Admin page (map, stuck, players)
on:
  pull_request:
    paths: ['tools/admin/**', 'tools/heatmap/**', 'nav-watch.js', 'bench/admin-*', '.github/workflows/admin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Point extraction, stuck causes and formatting
        run: node bench/admin-extract.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Every tab against a mocked Worker, escaping, phone width
        run: node bench/admin-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-evidence
          path: browser-evidence/admin-*.png
          retention-days: 7
