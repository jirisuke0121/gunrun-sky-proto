name: Easy touch controls
on:
  pull_request:
    paths: ['follow-camera.*', 'control-style.*', 'onboarding.*', 'i18n*.js', 'index.html', 'canyon.html', 'bench/follow-camera.test.cjs', 'bench/easy-controls-browser.cjs', '.github/workflows/easy-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Controller acceptance scenarios
        run: node bench/follow-camera.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Actual touch delivery and bilingual phone chooser
        run: node bench/easy-controls-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easy-controls-evidence
          path: browser-evidence/easy-controls/
          retention-days: 7
