name: Escape branch audit
on:
  pull_request:
    paths: ["bench/escape-branch-audit.cjs", ".github/workflows/escape-branch-audit.yml", "index.html", "canyon.html", "old-town-swing.js", "town-heights.js", "canyon-world.js", "escape-routes.js"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Audit current escape branches with full game physics
        run: |
          node bench/photo-routes.test.cjs
          node bench/photo-routes-physics.test.cjs
          node bench/escape-branch-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escape-branch-evidence
          path: branch-evidence/
          retention-days: 14
