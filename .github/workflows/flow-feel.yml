name: Flow feel and gap auto-jump trial
on:
  pull_request:
    paths: ['flow-feel.js', 'edge-assist.js', 'dash-boost.js', 'index.html', 'canyon.html', 'bench/flow-feel*', '.github/workflows/flow-feel.yml']
  push:
    branches: [main]
    paths: ['flow-feel.js', 'edge-assist.js', 'dash-boost.js', 'bench/flow-feel*', '.github/workflows/flow-feel.yml']
permissions:
  contents: read
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node bench/flow-feel-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-feel-evidence
          path: browser-evidence/flow-feel/
          retention-days: 7
