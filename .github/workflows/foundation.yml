name: Minimal runtime foundation
on:
  pull_request:
    paths: ['foundation-*.js', 'environment-profile.js', 'auto-resolution-monitor.js', 'render-quality.js', 'wall-readability.js', 'surface-readability.js', 'world-batching.js', 'enhancements.js', 'follow-camera.js', 'human-occlusion.js', 'human-view.js', 'look-pass.js', 'fixed-camera-trial.js', 'hybrid-camera.js', 'stable-camera.js', 'camera-cutaway.js', 'bench/stable-camera*', 'bench/hybrid-camera*', 'owner.*', 'owner-token.html', 'server/telemetry*', 'server/player*', 'ghost-replay.js', 'replay-scene.js', 'replay-audio.js', 'server/worker.js', 'index.html', 'canyon.html', 'bench/opaque-wall*', 'bench/wall-readability*', 'bench/foundation*', 'bench/db-efficiency.test.cjs', 'bench/player-console.test.cjs', 'server/*schema.sql', 'server/ranking-index.sql', '.github/workflows/foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Policy, API and existing record contracts
        run: |
          node bench/foundation.test.cjs
          node bench/foundation-environment.test.cjs
          node bench/db-efficiency.test.cjs
          node bench/player-console.test.cjs
          node bench/record-integrity.test.cjs
          node bench/shared-score.test.cjs
          node bench/ranked-ghost.test.cjs
          node bench/start-readiness.test.cjs
          node bench/hybrid-camera.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Both maps and authenticated owner screen
        run: node bench/foundation-browser.cjs
      - name: Cold loading and normal intro retry transitions
        run: node bench/start-readiness-browser.cjs
      - name: Wall floor and edge readability in both maps
        run: node bench/wall-readability-browser.cjs
      - name: Opaque walls photo fixtures and native movement
        run: node bench/opaque-walls-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-foundation-evidence
          path: |
            browser-evidence/foundation/
            browser-evidence/start-readiness/
            browser-evidence/wall-readability/
            browser-evidence/opaque-walls/
          retention-days: 7
  hybrid-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Hybrid camera sections and held movement
        run: |
          node bench/hybrid-camera.test.cjs
          node bench/stable-camera.test.cjs
          node bench/hybrid-camera-browser.cjs
          node bench/stable-camera-browser.cjs
          node bench/hybrid-camera-review-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-camera-evidence
          path: |
            browser-evidence/hybrid-camera/
            browser-evidence/stable-camera/
          retention-days: 7
