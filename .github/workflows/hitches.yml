name: Hitches, button rescue and zombie kinds
on:
  pull_request:
    paths: ['zombie-routing.js', 'zombie-types.js', 'touch-rescue.js', 'challenge-difficulty.js', 'challenge-score.js', 'enhancements.js', 'index.html', 'canyon.html', 'bench/leap-validity-cache-browser.cjs', 'bench/escape-lead-browser.cjs', 'bench/touch-rescue-browser.cjs', 'bench/zombie-types*', 'bench/zombie-routing.test.cjs', 'bench/shared-score.test.cjs', '.github/workflows/hitches.yml']
permissions:
  contents: read
jobs:
  hitches:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node bench/zombie-routing.test.cjs
      - run: node bench/zombie-types.test.cjs
      - run: node bench/shared-score.test.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Jump/drop edge validity matches a fresh sweep after doors, rooms and boxes change
        run: node bench/leap-validity-cache-browser.cjs
      - name: Squeeze forecast equals the previous implementation
        run: node bench/escape-lead-browser.cjs
      - name: A button press delivered to the canvas still presses the button
        run: node bench/touch-rescue-browser.cjs
      - name: Trial tier runs with all three zombie kinds
        run: node bench/zombie-types-browser.cjs
