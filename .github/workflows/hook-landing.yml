name: Hook arrival landing
on:
  pull_request:
    paths: ['hook-landing.js', 'edge-assist.js', 'free-hook.js', 'index.html', 'canyon.html', 'bench/hook-landing*', '.github/workflows/hook-landing.yml']
  push:
    branches: [main]
    paths: ['hook-landing.js', 'edge-assist.js', 'free-hook.js', 'bench/hook-landing*', '.github/workflows/hook-landing.yml']
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node bench/hook-landing.test.cjs
      - run: node bench/hook-touch-exits.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node bench/hook-landing-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hook-landing-evidence
          path: browser-evidence/hook-landing/
