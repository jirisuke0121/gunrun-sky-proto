name: Contextual hook tutorial
on:
  pull_request:
    paths: ['hook-tutorial.*', 'hook-targeting.js', 'index.html', 'canyon.html', 'bench/hook-tutorial*', '.github/workflows/hook-tutorial.yml']
  push:
    branches: [main, codex/contextual-hook-tutorial]
    paths: ['hook-tutorial.*', 'hook-targeting.js', 'index.html', 'canyon.html', 'bench/hook-tutorial*', '.github/workflows/hook-tutorial.yml']
permissions:
  contents: read
jobs:
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node bench/hook-tutorial.test.cjs
      - run: node bench/hook-touch-exits.test.cjs
      - name: Install browser for native map checks
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node bench/hook-tutorial-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextual-hook-tutorial
          path: browser-evidence/hook-tutorial/
