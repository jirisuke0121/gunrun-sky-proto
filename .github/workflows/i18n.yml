name: Languages
on:
  pull_request:
    paths: ['i18n*.js', 'tools/i18n/**', 'bench/i18n-*', 'index.html', 'canyon.html', 'guided-*.js', 'minimap.js', 'hook-tutorial.js', 'context-tutorial.js', '.github/workflows/i18n.yml']
permissions:
  contents: read
jobs:
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tools/i18n/keys.cjs check
      - run: node tools/i18n/build_packs.cjs --check
      - run: node bench/i18n-packs.test.cjs
      - run: node bench/i18n-browser.cjs
