name: Indoor entry and clear start
on:
  pull_request:
    paths: ['indoor-*.js', 'index.html', 'canyon.html', 'challenge-difficulty.js', 'bench/indoor-access*', 'bench/nav-field-refresh.test.cjs', '.github/workflows/indoor-access.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indoor-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Indoor permissions and navigation invalidation
        run: |
          node bench/indoor-access.test.cjs
          node bench/nav-field-refresh.test.cjs
          node bench/start-readiness.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Both maps with PC and touch input
        run: node bench/indoor-access-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indoor-entry-evidence
          path: outputs/indoor-entry/
          retention-days: 7
