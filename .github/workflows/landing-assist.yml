name: Landing assist (late-pressed jumps land on the roof they pass over)
on:
  pull_request:
    paths: ['index.html', 'edge-assist.js', 'escape-routes.js', 'town-heights.js', 'bench/landing-assist*', 'bench/jump-landing-scenario.js', '.github/workflows/landing-assist.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing-assist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node bench/landing-assist-browser.cjs
