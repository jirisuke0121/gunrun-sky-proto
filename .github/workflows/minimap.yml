name: Minimap terrain and nearby enemies
on:
  pull_request:
    paths: ['index.html', 'canyon.html', 'enhancements.js', 'minimap*', 'assets/minimap-rim.png', 'challenge-score.*', 'survival-score.*', 'touch-controls.css', 'hud-unify.css', 'player-skills.css', 'bench/minimap*', '.github/workflows/minimap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node bench/minimap.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node bench/minimap-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimap-evidence
          path: browser-evidence/minimap/
          retention-days: 14
