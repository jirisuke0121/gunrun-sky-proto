name: Intro tutorial
on:
  pull_request:
    paths: ['onboarding.*', 'next-step.js', 'index.html', 'canyon.html', 'bench/onboarding*', 'bench/next-step*', '.github/workflows/onboarding.yml']
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Rules
        run: |
          node bench/onboarding.test.cjs
          node bench/next-step.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Tutorial, first visit and result flows
        run: node bench/onboarding-browser.cjs
