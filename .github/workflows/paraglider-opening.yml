name: Paraglider opening
on:
  pull_request:
    paths: ['paraglider-opening.js', 'weapon-drops.js', 'start-spots.js', 'index.html', 'bench/paraglider-opening*', '.github/workflows/paraglider-opening.yml']
permissions:
  contents: read
jobs:
  paraglider-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Rules
        run: node bench/paraglider-opening.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Plane, glide, release and landing in the browser
        run: node bench/paraglider-opening-browser.cjs
