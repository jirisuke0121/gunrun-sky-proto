name: Photo routes and existing wall shortcuts
on:
  pull_request:
    paths: ["old-town-swing.js", "town-heights.js", "index.html", "bench/photo-*", "bench/wallrun-permissions-browser.cjs", ".github/workflows/photo-routes.yml"]
permissions:
  contents: read
jobs:
  photo-and-wall:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Geometry and default movement
        run: |
          node bench/photo-routes.test.cjs
          node bench/photo-routes-physics.test.cjs
          node bench/central-corners.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Both photo routes in the full game
        run: node bench/photo-routes-browser.cjs
      - name: All five original wall shortcuts
        env:
          WALLRUN_QA_MAP: old
        run: node bench/wallrun-permissions-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-and-wall-evidence
          path: browser-evidence/
          retention-days: 14
