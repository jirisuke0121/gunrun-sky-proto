name: Ranked spot starts
on:
  pull_request:
    paths: ['index.html', 'canyon.html', 'challenge-difficulty.js', 'start-readiness.js', 'bench/start-readiness*', 'ranking.js', 'run-records.js', 'replay-data.js', 'server/worker.js', 'bench/record-integrity*', 'old-town-swing.js', 'enhancements.js', 'bench/ranked-spots*', '.github/workflows/ranked-spots.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ranked-spots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Recorder, rankings, menu and audio lifecycle
        run: |
          node bench/start-readiness.test.cjs
          node bench/record-integrity.test.cjs
          node bench/ranked-spots.test.cjs
          node bench/ranked-ghost.test.cjs
          node bench/audio-recovery.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Cold loading, normal and intro starts, transitions and reload recovery
        run: node bench/start-readiness-browser.cjs
      - name: Desktop and touch spot start, audible effect, clear upload and result ranking
        run: node bench/ranked-spots-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranked-spots-evidence
          path: |
            browser-evidence/ranked-spots.json
            browser-evidence/start-readiness/
          retention-days: 14
