name: Roof passage and falling wall jumps
on:
  pull_request:
    paths: ["index.html", "canyon.html", "old-town-swing.js", "wall-jump-spots.js", "bench/roof-*", "bench/wallrun-permissions.test.cjs", ".github/workflows/roof-drop.yml"]
permissions:
  contents: read
jobs:
  roof-and-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Passage, permission and stair physics
        run: |
          node bench/roof-clearance.test.cjs
          node bench/wallrun-permissions.test.cjs
          node bench/stair-walk.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Roof and falling wall jumps in the full game
        run: node bench/roof-drop-browser.cjs
      - name: Existing marked shortcuts
        env:
          WALLRUN_QA_MAP: old
        run: node bench/wallrun-permissions-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roof-drop-evidence
          path: browser-evidence/
          retention-days: 14
