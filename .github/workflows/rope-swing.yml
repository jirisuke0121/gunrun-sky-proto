name: Rope swing (west platform to central roof) and wind
on:
  pull_request:
    paths: ['index.html', 'tower-tunnel.js', 'rope-swing.js', 'rope-stations.js', 'wind-fx.js', 'canyon.html', 'dash-boost.js', 'town-heights.js', 'bench/rope-swing*', 'bench/swing-hook*', 'parkour-swing.js', 'free-hook.js', 'bench/rope-stations*', 'bench/wind-fx*', 'bench/ambient-wind*', '.github/workflows/rope-swing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rope-swing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node bench/rope-swing-browser.cjs
      - run: node bench/swing-hook-browser.cjs
      - run: node bench/rope-stations-browser.cjs
      - run: node bench/wind-fx-browser.cjs
