name: Running browser checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Model and search checks
        run: |
          node bench/zombie-search.test.cjs
          node bench/player-skills.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Search behavior and real parkour escape
        run: |
          node bench/zombie-search-browser.cjs
          node bench/swing-flow-browser.cjs
          node bench/swing-flip.test.cjs
          node bench/swing-flip-browser.cjs
          node bench/player-skills-browser.cjs
      - name: Remaining practice and wall-run regressions
        run: |
          node bench/practice-browser.cjs
          node bench/practice-flow-browser.cjs
          node bench/wallrun-permissions-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-verification-evidence
          path: browser-evidence/
          retention-days: 7
