name: Running browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Model and behavior checks
        run: |
          node bench/human-running.test.cjs
          node bench/human-wallrun.test.cjs
          node bench/wallrun-permissions.test.cjs
          node bench/editor-autosave.test.cjs
          node bench/hook-touch-exits.test.cjs
          node bench/swing-timing.test.cjs
          node bench/human-actions.test.cjs
          node bench/human-view-running.test.cjs
          node bench/dash-boost.test.cjs
          node bench/gear-polish.test.cjs
          node bench/ranked-ghost.test.cjs
          node bench/path-distance-rounding.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Editor auto-save in desktop and touch browsers
        run: |
          node bench/editor-autosave-browser.cjs
      - name: Render and exercise both maps
        run: |
          node bench/human-running-browser.cjs
          node bench/human-aim-browser.cjs
          node bench/dash-browser.cjs
          node bench/swing-browser.cjs
          node bench/swing-flow-browser.cjs
          node bench/practice-browser.cjs
          node bench/practice-flow-browser.cjs
          node bench/wallrun-permissions-browser.cjs
      - name: Encode dash motion evidence
        run: |
          if [ -d browser-evidence/dash-motion ] && command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -v error -framerate 30 -i browser-evidence/dash-motion/%03d.png -c:v libx264 -pix_fmt yuv420p browser-evidence/dash-motion.mp4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: running-browser-evidence
          path: browser-evidence/
          retention-days: 7
