name: Stair walking checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stairs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real-map collision and ledge checks
        run: node bench/stair-walk.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Desktop and touch staircase traversal
        run: node bench/stair-walk-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stair-walk-evidence
          path: browser-evidence/stairs/
          retention-days: 7
