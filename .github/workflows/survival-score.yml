name: Time survival scoring
on:
  pull_request:
    paths: ['survival-score.js', 'challenge-score.*', 'i18n*.js', 'ranked-rules.js', 'server/worker.js', 'index.html', 'canyon.html', 'bench/survival-score*', 'bench/shared-score*', '.github/workflows/survival-score.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          node bench/survival-score.test.cjs
          node bench/shared-score.test.cjs
          node bench/record-integrity.test.cjs
          node bench/player-skills.test.cjs
  score-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Native clock, damage, pause, languages and results
        run: |
          node bench/survival-score-browser.cjs
          node bench/survival-score-wait-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-score-evidence
          path: |
            browser-evidence/survival-score/
            browser-evidence/survival-wait/
          retention-days: 14
