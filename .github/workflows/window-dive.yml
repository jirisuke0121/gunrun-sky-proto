name: Window dive (north-west pad to west window)
on:
  pull_request:
    paths: ['index.html', 'tower-tunnel.js', 'window-dive.js', 'town-heights.js', 'bench/window-dive*', '.github/workflows/window-dive.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  window-dive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node bench/window-dive-browser.cjs
