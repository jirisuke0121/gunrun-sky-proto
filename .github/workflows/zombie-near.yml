name: Zombie near geometry validation
on:
  pull_request:
    paths: [zombie-near.js, assets/zombie-near-indices.json, tools/build-zombie-near.mjs, "bench/zombie-near-*.cjs", .github/workflows/zombie-near.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      matrix:
        map: [index.html, canyon.html]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - run: node bench/zombie-near-bench.cjs
        env:
          BENCH_MAP: '${{ matrix.map }}'
      - if: matrix.map == 'canyon.html'
        run: node bench/zombie-near-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'near-${{ matrix.map }}'
          path: near-evidence/
