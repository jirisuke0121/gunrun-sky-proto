<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空中回廊・見た目の重さ A/B計測（どれが重いか絞る）</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font:14px/1.5 system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#panel{position:fixed;left:8px;top:8px;z-index:9;width:min(92vw,560px);max-height:90vh;overflow:auto;background:#000d;padding:10px 12px;border-radius:10px}
button{font:inherit;padding:8px 14px;margin-right:6px}
pre{white-space:pre-wrap;margin:8px 0 0;font:12px/1.55 ui-monospace,Menlo,monospace}
</style>
<div id="panel"><b>見た目の重さ A/B計測 #3: どれが重いか絞る（開くだけで自動）</b><div style="margin-top:6px"><button id="go">開始</button><button id="copy" hidden>結果をコピー</button></div><pre id="out">準備中…</pre></div>
<script>
// #2(ab-look-classic.html)で、11/10相当に全部戻すと約2.2ms(12.8ms中)軽くなると分かった(iPhone, 有意)。
// この#3は、その2.2msが何のせいかを絞る。同じ「今の見た目」を基準に、スイッチを1つだけ変えた版を読み込み直しながら交互に測る。
//   A 今の見た目 : ../index.html
//   B 全部戻す   : ?look=classic&mood=noon&outline=0&windFx=0   (#2の再現。2.2msが再び出るかの確認)
//   C 朝日なし   : ?mood=noon          (太陽グロー・遠景・塵・低い朝日の向きと色・露出をまとめて昼に戻す)
//   D 輪郭線なし : ?outline=0
//   E 街の色なし : ?look=district      (建物ごとの漆喰シェーダー・スレート屋根を外す。空・霧・地区の色は残る)
// ラウンドごとに順番を1つずつずらす(時間経過・発熱の偏りを相殺)。基準Aとの対の差を、変種ごとに出す。
// 1つの差が約1ms未満だと検出限界(約±1ms)に近いので、見えない差は「判定不能」と書く。足し算が#2の全部戻す(B)に近いかも見る。
// 差が60fps上限に隠れないよう、1フレームに K 回ぶん余計に描画して差を (K+1) 倍に増幅し、結果は (K+1) で割って1回あたりに戻す。
// ゲーム本体は変更しない。プレイ記録は送らない(iframe の fetch / sendBeacon を止め、計測後は iframe ごと捨てるのでゲームは終わらない)。
// 開くと自動で始まる(?auto=0 で手動)。調整: ?rounds=8 &slice=1000 &k=3 &settle=500 &stall=400 &pr=(描画倍率を固定)
const q = new URLSearchParams(location.search);
const ROUNDS = +q.get('rounds') || 8, SLICE = +q.get('slice') || 1000, K = +q.get('k') || 3, SETTLE = +q.get('settle') || 500, STALL = +q.get('stall') || 400, PR = +q.get('pr') || 0, AUTO = q.get('auto') !== '0';
const SIDES = {
  A: { label: '今の見た目', url: '../index.html' },
  B: { label: '全部戻す(11/10相当)', url: '../index.html?look=classic&mood=noon&outline=0&windFx=0' },
  C: { label: '朝日なし(mood=noon)', url: '../index.html?mood=noon' },
  D: { label: '輪郭線なし', url: '../index.html?outline=0' },
  E: { label: '街の色なし(look=district)', url: '../index.html?look=district' },
};
const KEYS = Object.keys(SIDES);
const $ = id => document.getElementById(id), out = $('out'), go = $('go'), copy = $('copy');
let running = false, lastText = '', stalls = 0, retries = 0, loadMs = [];

const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); };
const trimmedMean = a => { const s = a.slice().sort((x, y) => x - y), cut = Math.floor(s.length * .05); return mean(s.slice(0, s.length - cut || undefined)); };
const fmt = (v, d = 2) => (v >= 0 ? '+' : '') + v.toFixed(d);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function sampler(W, ms) {
  return new Promise(res => {
    const iv = []; let last = null, t0 = null;
    const tick = t => { if (last !== null) iv.push(t - last); last = t; t0 ??= t; if (t - t0 >= ms) return res(iv); W.requestAnimationFrame(tick); };
    W.requestAnimationFrame(tick);
  });
}
// 画面が隠れる・タブが止まると描画タイマーが止まり、数百ms〜数秒の間隔が混じる。STALL超は停止として除外して回数を数える。
// 有効な間隔が5個未満、または1割超が停止なら、その区間はやり直す(最大3回)。
async function measure(W, ms) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const all = await sampler(W, ms), good = all.filter(v => v <= STALL);
    stalls += all.length - good.length;
    if (good.length >= 5 && all.length - good.length <= Math.ceil(all.length * .1)) return trimmedMean(good);
    retries++;
  }
  return NaN;
}
const named = (scene, cam, name) => { const ids = new Set(); scene.traverse(o => { if (o.name === name) ids.add(o.id); }); cam.traverse?.(o => { if (o.name === name) ids.add(o.id); }); return ids.size; };

// 1回ぶん: iframeを作る → 読み込み完了を待つ → ゲーム開始 → 測る → 描画を止めて捨てる。
async function trial(sideKey, label) {
  const t0 = performance.now();
  const f = document.createElement('iframe'); f.allow = 'autoplay'; f.src = SIDES[sideKey].url; document.body.prepend(f);
  let W = null;
  try {
    for (let waited = 0; ; waited += 250) {
      await sleep(250);
      try { W = f.contentWindow; if (W.__game && W.__skyInternals && W.document.getElementById('bStart') && !W.document.getElementById('bStart').disabled) break; } catch {}
      if (waited > 120000) throw new Error('ゲームの読み込みが2分以内に終わりませんでした');
    }
    loadMs.push(performance.now() - t0);
    // 記録を送らない(送信手段を止める。返事は「保存済み」の形)。
    W.fetch = () => Promise.resolve(new W.Response('{"ok":true,"top":[],"total":0,"recordProtocol":2}', { status: 200, headers: { 'content-type': 'application/json' } }));
    try { W.navigator.sendBeacon = () => true; } catch {}
    const G = W.__game, I = W.__skyInternals, rd = G.debug.renderer, scene = I.ue, cam = I.Se;
    G.startGame(); G.P.invuln = 1e9;
    await sleep(2500);
    const base = PR || rd.getPixelRatio();
    let extra = 0; const origRender = rd.render;
    rd.render = function (s, c) {
      if (s === scene && extra > 0) { const ac = rd.autoClear; rd.autoClear = true; for (let i = 0; i < extra; i++) origRender.call(rd, s, c); rd.autoClear = ac; }
      return origRender.call(rd, s, c);
    };
    if (PR) rd.setPixelRatio(PR);
    extra = K;
    const slice = async () => { out.textContent = label + '（画面に触れないでください）'; await sampler(W, SETTLE); return measure(W, SLICE); };
    const f1 = await slice(), f2 = await slice();
    extra = 0; rd.render = origRender; rd.setPixelRatio(base);
    // 何が効いていたかの裏づけ: 描画命令数・三角形数、切り替えが効いたかの確認。
    await sampler(W, 100);
    const info = rd.info?.render || {};
    const facts = { calls: info.calls, tris: info.triangles, look: W.skyLook || 'default', mood: W.skyMoodName, ink: named(scene, cam, 'Ink outline'), glow: named(scene, cam, 'Sun glow'), skyline: named(scene, cam, 'Far skyline'), motes: named(scene, cam, 'Dust motes'), contact: named(scene, cam, 'Contact shadow'), shadows: !!rd.shadowMap?.enabled };
    const rq = W.skyRenderQuality?.snapshot?.() || {};
    facts.mode = rq.mode; facts.pr = rd.getPixelRatio();
    const per = Number.isFinite(f1) && Number.isFinite(f2) ? (f1 + f2) / 2 : NaN;
    return { per, facts };
  } finally {
    // WebGLのコンテキストを確実に手放してから捨てる(24回ぶん作り直してもメモリが溜まらないように)。
    try { const rd = W.__game.debug.renderer; rd.dispose?.(); rd.forceContextLoss?.(); } catch {}
    try { f.src = 'about:blank'; } catch {}
    await sleep(200); f.remove(); await sleep(300);
  }
}

function report(rows, done, total, finished) {
  const per = k => rows.map(r => r[k]?.per);
  const ok = k => rows.filter(r => Number.isFinite(r.A?.per) && Number.isFinite(r[k]?.per));
  const med = a => { const v = a.filter(Number.isFinite).sort((x, y) => x - y); return v.length ? v[Math.floor(v.length / 2)] : NaN; };
  const stats = {};
  for (const k of KEYS.slice(1)) {
    const v = ok(k), d = v.map(r => (r.A.per - r[k].per) / (K + 1)), n = d.length;
    const saved = n ? mean(d) : NaN, s = sd(d), se = n > 1 ? s / Math.sqrt(n) : NaN, t = se ? saved / se : 0, limit = 2 * se;
    const level = n < 4 ? '有効ラウンドが少なく判定不能' : t >= 2 && saved >= 1 ? '大きい(有意)' : t >= 2 && saved >= .3 ? '小さい(有意)' : t >= 2 ? '誤差の範囲(有意だが0.3ms未満)' : limit < 1 ? '差は見えなかった' : '判定不能(ばらつき大)';
    stats[k] = { n, saved, s, se, t, limit, level, calls: med(rows.map(r => r[k]?.facts?.calls)), tris: med(rows.map(r => r[k]?.facts?.tris)) };
  }
  const aPer = rows.length ? mean(rows.map(r => r.A?.per).filter(Number.isFinite)) / (K + 1) : NaN;
  const aF = rows.map(r => r.A?.facts).filter(Boolean)[0] || {}, aCalls = med(rows.map(r => r.A?.facts?.calls)), aTris = med(rows.map(r => r.A?.facts?.tris));
  const single = KEYS.slice(2).filter(k => Number.isFinite(stats[k].saved)).sort((x, y) => stats[y].saved - stats[x].saved);
  const sum = single.reduce((s, k) => s + stats[k].saved, 0);
  const top = single.filter(k => stats[k].level.startsWith('大きい'));
  const head = !Number.isFinite(stats.B?.saved) ? '全部戻す(B)の結果がまだありません'
    : top.length ? `2.2msのうち効いているもの: ${top.map(k => `${SIDES[k].label}(${fmt(stats[k].saved)}ms)`).join('、')}`
    : `1つずつでは、はっきり効いているものは見えませんでした（全部戻すBは ${fmt(stats.B.saved)}ms ±${stats.B.limit.toFixed(1)}）`;
  const line = k => { const st = stats[k]; return st.n < 2 ? `・${SIDES[k].label}: 有効ラウンドが${st.n}回で判定不能` : `・${SIDES[k].label}: 戻すと ${fmt(st.saved)} ms（±${st.s.toFixed(2)}、t=${st.t.toFixed(1)}、検出限界 約±${st.limit.toFixed(1)}）→ ${st.level}｜三角形 ${Math.round((aTris - st.tris) / 1000) >= 0 ? '-' : '+'}${Math.abs(Math.round((aTris - st.tris) / 1000))}k、命令数 ${Number.isFinite(st.calls) ? fmt(st.calls - aCalls, 0) : '?'}`; };
  const lines = [
    finished ? `【結論】${head}` : `計測中… ${done}/${total}ラウンド（途中経過）: ${head}`,
    '(数字は「1回の描画あたりms」。差＝今の見た目 − その版。正なら今のほうが重い。三角形・命令数は今との差)',
    '',
    `・基準(今の見た目) ${Number.isFinite(aPer) ? aPer.toFixed(1) : '?'} ms、三角形 ${Math.round(aTris / 1000)}k、描画命令数 ${aCalls}`,
    line('B'),
    '  ↑ #2の再現（前回は +2.16ms）',
    ...['C', 'D', 'E'].map(line),
    `  (C+D+E の合計 ${fmt(sum)}ms。Bの ${Number.isFinite(stats.B?.saved) ? fmt(stats.B.saved) : '?'}ms に近いかを見る。大きく違えば重なって効いているか、見えない部分がある)`,
    '',
    `切り替えの確認: ${KEYS.map(k => { const f = rows.map(r => r[k]?.facts).filter(Boolean)[0]; return f ? `${k}:look=${f.look},mood=${f.mood},輪郭${f.ink},グロー${f.glow},遠景${f.skyline},塵${f.motes},接地${f.contact}` : `${k}:?`; }).join(' / ')}`,
    `有効ラウンド ${Math.max(...KEYS.slice(1).map(k => stats[k].n), 0)}/${done}、描画停止の検知 ${stalls}回、区間のやり直し ${retries}回、1回の読み込み 約${loadMs.length ? (mean(loadMs) / 1000).toFixed(0) : '?'}秒`,
    `端末: ${navigator.userAgent.replace(/^Mozilla\/5.0 /, '').slice(0, 90)}`,
    `画面: ${innerWidth}x${innerHeight} DPR${devicePixelRatio} / 描画画質: ${aF.mode ?? '?'} 倍率${PR ? PR + '(?pr指定)' : aF.pr ?? '?'} 影${aF.shadows ? 'あり' : 'なし'}`,
    `設定: 1区間${SLICE}ms × 2 × ${KEYS.length}版 × ${total}ラウンド、増幅K=${K}、日時 ${new Date().toISOString()}`,
    '※1つずつの差は小さいので、検出限界(±1ms前後)に近い。見えない差は「判定不能」。端末が熱いと数字が動くので、迷ったら冷めてからもう一度。',
  ];
  return { text: lines.join('\n'), stats, aPer, per };
}

async function run() {
  if (running) return; running = true; go.disabled = true; copy.hidden = true; stalls = 0; retries = 0; loadMs = [];
  const rows = [];
  try {
    for (let r = 0; r < ROUNDS; r++) {
      const order = KEYS.map((_, i) => KEYS[(i + r) % KEYS.length]), row = {};
      for (const k of order) row[k] = await trial(k, `計測中… ラウンド ${r + 1}/${ROUNDS}・${SIDES[k].label}`);
      rows.push(row);
      const rep = report(rows, r + 1, ROUNDS, false); lastText = rep.text; out.textContent = rep.text; copy.hidden = false;
    }
  } finally { running = false; }
  const rep = report(rows, ROUNDS, ROUNDS, true);
  lastText = rep.text; out.textContent = rep.text; go.textContent = '計測し直す'; go.disabled = false; copy.hidden = false;
  window.__abResult = { K, SLICE, ROUNDS, rows, stats: rep.stats, aPer: rep.aPer };
}
const start = () => run().catch(e => { out.textContent = '計測が止まりました: ' + (e && e.message || e) + '\n\n' + lastText; running = false; go.disabled = false; });
go.addEventListener('click', start);
copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(lastText); copy.textContent = 'コピーしました'; } catch { const r = document.createRange(); r.selectNodeContents(out); getSelection().removeAllRanges(); getSelection().addRange(r); copy.textContent = '文字を選択しました'; } });
if (AUTO) { out.textContent = '3秒後に自動で計測を始めます（ゲームを40回読み込み直すので、5〜8分かかります。画面に触れない・画面を消さない）。'; setTimeout(start, 3000); }
else out.textContent = '「開始」を押すと計測します。';
</script>
</html>
