<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>空中回廊・画面内の密集負荷</title>
<style>
body{margin:0;background:#15232b;color:#edf4f2;font:15px/1.6 system-ui}main{max-width:1200px;margin:auto;padding:20px}button,select{font:inherit;padding:8px 12px;margin:4px}button{cursor:pointer}h1{font-size:24px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:7px;text-align:right;border-bottom:1px solid #43535a}td:first-child,th:first-child{text-align:left}iframe{width:100%;height:460px;border:0;background:#000}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}.running iframe{position:fixed;inset:0;width:100%;height:100%;z-index:3}.running #status{position:fixed;top:0;left:0;right:0;z-index:4;margin:0;padding:5px 12px;background:#10232de8;font-size:12px}.running #stop{position:fixed;right:8px;bottom:8px;z-index:4}.running main>h1,.running main>p,.running .controls,.running table,.running pre{display:none}.note{color:#b8c9d0}#result{max-height:240px;overflow:auto}
</style>
<main><h1>画面内の密集負荷：6体・8体・12体</h1>
<p>実ゲームのモデル・地形・描画設定を使い、全個体が同じ画面に入る配置で比較します。固定密集と、接近・HG射撃を反復する条件を分けます。プレイ記録は送信せず、保存設定も変更しません。</p>
<div class="controls"><label>ビルド<select id="build"><option value="current">変更後</option><option value="baseline">変更前（ローカル保存版）</option></select></label><label>時間<select id="seconds"><option>10</option><option>20</option><option>30</option></select>秒／条件</label><label>反復<select id="repeats"><option>3</option><option>1</option></select></label><label>人数<select id="counts"><option value="6,8,12">6・8・12体</option><option value="0,2,4">0・2・4体</option><option value="0,6">0・6体</option><option value="6">6体</option></select></label><label>場面<select id="modes"><option value="both">固定・接近</option><option value="fixed">固定のみ</option><option value="chase">接近のみ</option></select></label><label>マップ<select id="maps"><option value="both">両マップ</option><option value="index.html">旧市街</option><option value="canyon.html">渓谷</option></select></label><label>描画条件<select id="variant"><option value="production">通常設定</option><option value="no-shadow">影なし・切り分け用</option><option value="pixel-1">描画倍率1・切り分け用</option></select></label><label>画質モード<select id="quality"><option value="performance">軽量</option><option value="balanced">標準</option><option value="high">高画質（以前）</option></select></label><label><input type="checkbox" id="otherStopped">他のゲーム停止を確認</label><button id="start">両マップの比較を開始</button><button id="quick">表示と計測の短い確認</button><button id="export" disabled>結果JSONを保存</button></div>
<label class="controls">GPU時間の計測<select id="gpuProbe"><option value="off">オフ（FPS比較用）</option><option value="on">オン（GPU切り分け用）</option></select></label><button id="stop" disabled>中止</button><p id="status" role="status">待機中</p><iframe id="game" title="密集状態の実ゲーム"></iframe>
<p class="note">FPSとフレーム間隔はこのMac・ブラウザでの観測値です。CPUの描画命令発行時間とGPU時間は別々に記録します。GPU計測非対応時は空欄。画面内人数不足・背景タブ・サイズ変更・モデル未読込は無効として残します。</p>
<table><thead><tr><th>条件</th><th>人数</th><th>FPS</th><th>p95間隔 ms</th><th>33.3ms超 %</th><th>CPU p95 ms</th><th>GPU p95 ms</th><th>画面内 最小</th></tr></thead><tbody id="rows"></tbody></table><details><summary>計測データの概要</summary><pre id="result"></pre></details></main>
<script type="module" src="./crowd-performance.js?v=20261030-v1"></script></html>
