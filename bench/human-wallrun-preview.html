<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>空中回廊 壁走りの動作確認</title>
<style>body{margin:0;background:#111a23;color:#e4f0f5;font:15px system-ui}main{max-width:1200px;margin:auto;padding:16px}h1{font-size:22px}p{line-height:1.6}button{padding:10px 16px;margin:0 6px 8px 0;border:1px solid #608080;border-radius:7px;background:#23414b;color:white;font:inherit}iframe{width:100%;height:68vh;min-height:300px;border:1px solid #546b77}output{display:block;white-space:pre-wrap;font:13px ui-monospace,monospace;line-height:1.6;color:#a8e5ce}.note{color:#afc7d2}</style>
<main><h1>空中回廊 壁走りの動作確認</h1>
<p class="note">実マップの壁でゲーム本体の移動処理を使い、専用モーションを確認します。このページでは記録送信と設定保存を止めています。</p>
<nav><button id="old">旧市街を確認</button><button id="canyon">岩壁渓谷を確認</button><button id="left">反対向き</button><button id="pause">一時停止</button><button id="view">一人称／三人称</button><button id="shot">射撃</button><button id="capture">画像を保存</button></nav>
<iframe id="game" title="壁走りの実ゲーム画面" sandbox="allow-same-origin allow-scripts"></iframe>
<output id="result">準備中…</output></main>
<script src="../wall-jump-candidates.js"></script>
<script type="module">
const frame=document.querySelector('#game'),result=document.querySelector('#result');
let w,g,c,sky,scenario,clock=0,paused=false,direction=1,last=null,ready=false,demoWall=true,checks=[],errors=[];
const check=(ok,message)=>{if(!ok)throw Error(message);checks.push('PASS '+message);};
const wait=()=>new Promise(r=>setTimeout(r,50));
function reset(s,sign=1){
  const n=s.normal,t={x:-n.z*sign,z:n.x*sign};
  c.pos.set(s.x,s.y,s.z);c.vel.set(t.x*g.S.sprintSpeed,1.8,t.z*g.S.sprintSpeed);
  Object.assign(c,{state:'normal',onGround:false,airT:.12,wallKey:null,wallT:0,jumpBuf:0,coyote:0,ledge:null,edgeOff:null,catchCD:1,hookPressed:false,zipWish:0,slideBuf:0,slideCD:1,setCD:1,pitch:-.12,yaw:Math.atan2(-t.x*.955+n.x*.296,-t.z*.955+n.z*.296),camY:s.y+1.62});
  sky.z.over=false;sky.z.safeT=10;g.keys.KeyW=true;g.S.gunOn=true;g.S.autoSprint=true;g.S.sendLog=false;
  for(const k of Object.keys(g.keys))if(k!=='KeyW')g.keys[k]=false;
  g.setMode('play');
  // Match placeAt: a new scenario also resets the independent follow view.
  w.skyFollowCamera?.reset();
}
function step(dt){g.playerStep(dt);c.camY=c.pos.y+c.eye;g.cam(dt);w.skyHumanView.update(dt);}
function draw(){g.debug.renderer.clear();g.debug.renderer.render(g.debug.scene,g.debug.camera);}
function findScenario(){
  for(const {at:[x,y,z],normal:[nx,nz]} of w.__skyWallRunSpots||[]){
    const s={x:x+nx*(c.r+.04),y,z:z+nz*(c.r+.04),normal:{x:nx,z:nz}};
    reset(s);let count=0;for(let i=0;i<24;i++){g.playerStep(1/60);if(c.state==='wallrun')count++;}
    if(count>=18)return s;
  }
  for(const b of g.solids.filter(b=>b.type==='mono'&&b.wr!==false&&b.maxY-b.minY>3)){
    for(const n of [{x:1,z:0},{x:-1,z:0},{x:0,z:1},{x:0,z:-1}]){
      if(b.wf&&!b.wf[n.x+','+n.z])continue;
      if((n.x?b.maxZ-b.minZ:b.maxX-b.minX)<8)continue;
      const s={normal:n,x:n.x?(n.x>0?b.maxX:b.minX)+n.x*(c.r+.04):(b.minX+b.maxX)/2,
        z:n.z?(n.z>0?b.maxZ:b.minZ)+n.z*(c.r+.04):(b.minZ+b.maxZ)/2,y:b.minY+1.2};
      if(!g.freeAt(s.x,s.y,s.z,c.r,c.h))continue;
      reset(s);let count=0;
      for(let i=0;i<24;i++){g.playerStep(1/60);if(c.state==='wallrun')count++;}
      if(count>=18)return s;
    }
  }
  throw Error('長い壁での発動を確認できません');
}
async function boot(map){
  ready=false;checks=[];errors=[];result.textContent='モデルとマップを読み込み中…';
  const base=new URL('../',location.href).href;
  const guard=`<base href="${base}"><script>window.__hold=true;
  const originalFetch=window.fetch.bind(window);window.fetch=(url,options)=>/gunrun-runs\\./.test(String(url))?Promise.resolve(new Response('{}',{status:200,headers:{'content-type':'application/json'}})):originalFetch(url,options);
  Storage.prototype.setItem=()=>{};Storage.prototype.removeItem=()=>{};Storage.prototype.clear=()=>{};<\/script>`;
  try{
    const source=await fetch(new URL(map,base)).then(r=>r.text());
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.srcdoc=source.replace('<head>',`<head>${guard}`);await loaded;
    for(let i=0;i<400&&!frame.contentWindow.skyHumanView;i++)await wait();
    w=frame.contentWindow;w.addEventListener('error',e=>errors.push(e.message));
    check(!!w.skyHumanView,'ゲーム本体を読み込み');
    w.skyHumanView.select('unity');
    for(let i=0;i<400&&w.document.body.dataset.skyHumanLoaded!=='true';i++)await wait();
    check(w.document.body.dataset.skyHumanAnimated==='true','実モデルと全モーションを読み込み');
    g=w.__game;c=g.P;sky=w.__skyInternals;g.S.sendLog=false;w.document.getElementById('bStart').click();
    check(g.mode==='play','開始ボタンでプレイ開始');
    demoWall=map!=='canyon.html';
    if(!demoWall){
      g.keys.KeyW=true;for(let i=0;i<24;i++)step(1/60);g.keys.KeyW=false;
      check(c.state!=='wallrun','渓谷の壁走り無効設定を維持');
      check(!w.document.body.dataset.skyHumanAction.startsWith('parkourWall'),'渓谷の通常姿勢を維持');
      check(g.debug.renderer.getContext().getError()===0,'WebGL描画エラーなし');
      draw();ready=true;result.textContent=checks.join('\n')+'\n渓谷は壁走りの発動が無効です。共有モデルの読込・通常描画を確認しました。';document.body.dataset.result='passed';return;
    }
    const allowed=[];let denied=0;
    for(const [index,b] of g.solids.entries())if(b.type==='mono'&&b.wr!==false){
      for(const n of [{x:1,z:0},{x:-1,z:0},{x:0,z:1},{x:0,z:-1}]){
        if(w.__skyCanWallRunOnFace(b,n)){allowed.push({index,b,n});continue;}
        if((n.x?b.maxZ-b.minZ:b.maxX-b.minX)<4)continue;
        const s={normal:n,x:n.x?(n.x>0?b.maxX:b.minX)+n.x*(c.r+.04):(b.minX+b.maxX)/2,
          z:n.z?(n.z>0?b.maxZ:b.minZ)+n.z*(c.r+.04):(b.minZ+b.maxZ)/2,y:b.minY+1.2};
        if(!g.freeAt(s.x,s.y,s.z,c.r,c.h))continue;
        reset(s);let entered=false;for(let i=0;i<8;i++){g.playerStep(1/60);if(c.state==='wallrun')entered=true;}
        check(!entered,'非許可の壁面では発動しない #'+index+' '+n.x+','+n.z);denied++;
      }
    }
    check(allowed.length===5,'許可する壁面はショートカット5面だけ');
    check(denied>=8,'複数の非許可壁面を実際の移動処理で確認');
    check(w.skyWallRunGuides?.routes.length===allowed.length,'許可面すべてに目印を表示');
    for(const guide of w.skyWallRunGuides.routes){
      const b=guide.wall,{x:nx,z:nz}=guide.normal;
      const plane=nx?(nx>0?b.maxX:b.minX):(nz>0?b.maxZ:b.minZ);
      check(Math.abs(plane-(nx?guide.at[0]:guide.at[2]))<.05,'目印が地点と同じ壁面 '+guide.name);
      let inside=true;
      for(const mesh of [guide.band,guide.launch]){
        mesh.updateMatrixWorld(true);const vertices=mesh.geometry.getAttribute('position');
        for(let i=0;i<vertices.count;i++){
          const p=new sky.Geom.Vector3().fromBufferAttribute(vertices,i).applyMatrix4(mesh.matrixWorld);
          p.x-=nx*.1;p.z-=nz*.1;
          inside&&=p.x>b.minX&&p.x<b.maxX&&p.y>b.minY&&p.y<b.maxY&&p.z>b.minZ&&p.z<b.maxZ;
        }
      }
      check(inside,'目印の全頂点が実際の壁面内 '+guide.name);
    }
    for(const {at:[x,y,z],normal:[nx,nz]} of w.__skyWallRunSpots){
      const route=window.skyWallJumpCandidates.find(route=>route.status==='ok'&&route.at[0]===x&&route.at[2]===z);
      const finish=route.path.at(-1),start=route.path[0],sign=(-nz*(x-start[0])+nx*(z-start[2]))<0?-1:1;
      reset({x:x+nx*(c.r+.04),y,z:z+nz*(c.r+.04),normal:{x:nx,z:nz}},sign);step(1/60);
      check(c.state==='wallrun','ショートカットの許可地点で発動 '+x+','+z);
      const jumps=g.stats.walljumps||0;c.jumpBuf=.2;step(1/60);
      check((g.stats.walljumps||0)>jumps&&c.vel.y>0,'ショートカット地点で壁ジャンプ '+x+','+z+' '+JSON.stringify({before:jumps,after:g.stats.walljumps,y:c.vel.y,state:c.state,pos:c.pos.toArray(),normal:c.wallN}));
      let landed=false;const life=c.life;
      for(let i=0;i<180;i++){
        c.yaw=Math.atan2(c.pos.x-finish[0],c.pos.z-finish[2]);step(1/60);
        if(c.onGround){landed=true;break;}
      }
      check(landed&&c.life===life&&Math.hypot(c.pos.x-finish[0],c.pos.z-finish[2])<2&&Math.abs(c.pos.y-finish[1])<.65,
        'ショートカット先へ着地 '+route.title+' '+JSON.stringify({pos:c.pos.toArray(),target:finish,life:c.life}));
      if(route.label==='⑤'){
        reset({x:x+nx*(c.r+.04),y:0,z:3,normal:{x:nx,z:nz}},sign);
        c.vel.set(0,0,0);c.onGround=true;c.airT=0;c.coyote=.1;c.jumpBuf=.18;
        let ran=false,jumped=false,arrived=false;const before=g.stats.walljumps||0;
        for(let i=0;i<240;i++){
          if(!jumped&&c.state==='wallrun'){
            ran=true;
            if(c.pos.z>=6.3&&w.__skyCanWallJumpAtSpot(c,(px,py,pz)=>g.solids.find(b=>b.type==='mono'&&px>b.minX&&px<b.maxX&&py>b.minY&&py<b.maxY&&pz>b.minZ&&pz<b.maxZ),c.wallN))c.jumpBuf=.18;
          }
          if(jumped)c.yaw=Math.atan2(c.pos.x-finish[0],c.pos.z-finish[2]);
          step(1/60);
          jumped||=(g.stats.walljumps||0)>before;
          if(jumped&&c.onGround){arrived=true;break;}
        }
        check(ran&&jumped&&arrived&&c.life===life&&Math.hypot(c.pos.x-finish[0],c.pos.z-finish[2])<2,
          '写真の入口から助走・壁走り・壁ジャンプで着地 '+JSON.stringify({pos:c.pos.toArray(),ran,jumped,arrived,life:c.life}));
      }
    }
    scenario=findScenario();const before=g.stats.wallruns;
    for(const sign of [1,-1]){
      reset(scenario,sign);for(let i=0;i<18;i++)step(1/60);
      check(c.state==='wallrun','実際の壁を検出して壁走り '+sign);
      const data=w.document.body.dataset,holder=sky.ue.getObjectByName('Unity challenge human');
      check(data.skyHumanClip==='wallrun','壁走り専用モーション '+sign);
      const side=+data.skyHumanWallSide,phase=data.skyHumanWallPhase,yaw=holder.rotation.y,lookYaw=c.yaw;
      check(data.skyHumanAction===(side<0?'parkourWallLeft':'parkourWallRight'),'壁側に合う左右の姿勢 '+sign);
      c.yaw+=.6;g.cam(1/60);w.skyHumanView.update(1/60);
      check(Math.abs(Math.atan2(Math.sin(holder.rotation.y-yaw),Math.cos(holder.rotation.y-yaw)))<.0001,'視線を動かしても壁沿いを向く '+sign);
      check(data.skyHumanWallPhase===phase,'移動停止時は足運びも停止 '+sign);
      let body;holder.traverse(o=>{if(o.isMesh&&o.name.startsWith('Body_mesh'))body=o;});
      const weights=[...body.morphTargetInfluences];g.setMode('pause');w.skyHumanView.update(.1);
      check(weights.every((v,i)=>v===body.morphTargetInfluences[i]),'一時停止でモーション停止 '+sign);g.setMode('play');
      check(weights.every(Number.isFinite),'描画姿勢に不正な値なし '+sign);
      c.yaw=lookYaw;g.cam(1/60);w.skyHumanView.update(0);
      const ammo=sky.Et.ammo;sky.Et.fireCD=0;sky.fireWeapon();
      check(sky.Et.ammo<ammo,'壁走り中に実際に射撃 '+sign);
      check(+data.skyHumanGripError<.04&&+data.skyHumanAimError<.005,'壁走り射撃の両手と銃口の整合 '+sign+' ('+data.skyHumanGripError+', '+data.skyHumanAimError+')');
      // End the real wall run by releasing the movement input, then let the
      // game's gravity, collision and landing logic finish the transition.
      g.keys.KeyW=false;step(1/60);
      check(c.state!=='wallrun'&&data.skyHumanAction==='parkourJump','壁離脱から空中姿勢へ '+sign);
      let landed=false;for(let i=0;i<160;i++){step(1/60);if(c.onGround){landed=true;break;}}
      check(landed,'壁離脱後に実際の足場へ着地 '+sign);
      for(let i=0;i<30;i++)step(1/60);
      check(!data.skyHumanAction.startsWith('parkourWall'),'着地後に通常姿勢へ '+sign);
    }
    check(g.stats.wallruns>=before+2,'両方向の壁走りをゲーム本体が記録');
    const jumpSpot={x:14+c.r+.04,y:1.4,z:6.8,normal:{x:1,z:0}};
    reset(jumpSpot);step(1/60);const jumps=g.stats.walljumps||0;c.jumpBuf=.2;step(1/60);
    check((g.stats.walljumps||0)>jumps&&c.vel.y>0,'登録済みスポットで実際に壁ジャンプ');
    check(w.document.body.dataset.skyHumanAction==='parkourJump','壁ジャンプから跳躍モーションへ');
    check(errors.length===0,'ブラウザー実行エラーなし');
    check(g.debug.renderer.getContext().getError()===0,'WebGL描画エラーなし');
    reset(scenario,direction);clock=0;paused=false;ready=true;
    result.textContent=checks.join('\n')+'\n左右の壁走りを繰り返し再生中。';document.body.dataset.result='passed';
  }catch(error){document.body.dataset.result='failed';result.textContent=checks.join('\n')+'\nFAIL '+error.message;console.error(error);}
}
document.querySelector('#old').onclick=()=>boot('index.html');document.querySelector('#canyon').onclick=()=>boot('canyon.html');
document.querySelector('#left').onclick=()=>{if(ready&&demoWall){direction*=-1;reset(scenario,direction);clock=0;}};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生':'一時停止';};
document.querySelector('#view').onclick=()=>w?.document.dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyV',bubbles:true}));
document.querySelector('#shot').onclick=()=>{if(ready){sky.Et.fireCD=0;sky.fireWeapon();}};
document.querySelector('#capture').onclick=()=>{if(ready){draw();const a=document.createElement('a');a.download='wallrun-game.png';a.href=g.debug.renderer.domElement.toDataURL('image/png');a.click();}};
function animate(now){requestAnimationFrame(animate);const dt=last===null?1/60:Math.min(.04,(now-last)/1000);last=now;if(!ready)return;
  if(!paused&&demoWall){clock+=dt;if(clock>.55){direction*=-1;reset(scenario,direction);clock=0;}step(dt);}draw();
}
requestAnimationFrame(animate);boot(new URLSearchParams(location.search).get('map')==='canyon'?'canyon.html':'index.html');
</script></html>
