<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>区間カメラの比較</title>
<style>body{margin:0;background:#17232b;color:#edf1ef;font:15px system-ui}header{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 16px 0 0}button,select{font:inherit;color:inherit;background:#30434e;border:1px solid #8caaac;border-radius:6px;padding:9px 14px}button[aria-pressed=true]{background:#bce1cd;color:#132b21}p{margin:0;padding:0 16px 12px;color:#bdcccf}iframe{display:block;width:100%;height:calc(100vh - 125px);border:0;min-height:390px}@media(max-height:500px){header{padding:5px 10px;gap:5px}h1{font-size:14px}button,select{padding:5px;font-size:12px}p{font-size:12px}iframe{height:calc(100vh - 95px);min-height:280px}}</style>
<header><h1>カメラと操作の比較</h1><button data-variant="legacy" aria-pressed="false">修正前</button><button data-variant="hybrid" aria-pressed="true">修正版</button><button data-variant="fixed" aria-pressed="false">固定視点</button><select id="scene" aria-label="場所"></select><button id="play" disabled>ここから遊ぶ</button></header><p id="status">読み込み中…</p><iframe id="game" title="通路と路地でカメラを比較"></iframe>
<script type="module">
import {HYBRID_CAMERA_SCENES as scenes} from './hybrid-camera-scenes.js';
const frame=document.querySelector('#game'),status=document.querySelector('#status'),play=document.querySelector('#play'),select=document.querySelector('#scene');let variant='hybrid',generation=0,active;
for(const scene of scenes){const o=document.createElement('option');o.value=scene.id;o.textContent=scene.label;select.append(o)}select.value='north-corridor';
const pause=()=>new Promise(r=>setTimeout(r,50));
async function load(){const gen=++generation;play.disabled=true;active=null;delete frame.dataset.readyVariant;delete frame.dataset.readyScene;status.textContent='比較画面を読み込み中…';document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));
 const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.src='../index.html?camera=after&wallView=opaque&cameraTrial='+(variant==='legacy'?'hybrid':variant)+'&cameraControl='+(variant==='legacy'?'legacy':'stable')+'&onboarding=0&controlpick=0&hookGuide=0&dev=1&lang=ja';await loaded;
 const w=frame.contentWindow;w.__hold=true;
 for(let i=0;i<2400&&(!w.skyStartReadiness?.ready||!w.skyLookInfo);i++){if(gen!==generation)return;if(w.skyStartReadiness?.state.phase==='error')throw Error(w.skyStartReadiness.state.message);await pause()}
 if(gen!==generation)return;if(!w.skyStartReadiness?.ready)throw Error('読み込みを完了できませんでした。');
 // Keep comparison controls reachable on desktop, including after clicking
 // the game. Fixed/hybrid views do not require pointer capture.
 w.document.getElementById('c').requestPointerLock=()=>w.Promise.reject(new w.DOMException('Comparison keeps the pointer free','NotAllowedError'));
 w.document.getElementById('bStart').click();const g=w.__game;g.S.sendLog=g.S.autoFire=false;g.GAME.spawnT=g.GAME.surgeT=Infinity;g.SCR.off=g.PACE.off=g.MARK.off=true;g.P.invuln=Infinity;
 for(const z of g.zombies){w.__skyInternals.ue.remove(z.m.root);if(z.pool)w.__skyInternals.ue.remove(z.pool)}g.zombies.length=0;
 w.skySwing.reset();g.P.pos.set(...scenes.find(x=>x.id===select.value).at);g.P.lastGround.copy(g.P.pos);g.P.safe.copy(g.P.pos);g.P.vel.set(0,0,0);g.P.state='normal';g.P.onGround=true;g.P.yaw=g.P.pitch=0;g.P.shake=0;w.skyFollowCamera.reset();g.frameOnce(0);
 active=w;frame.dataset.readyVariant=variant;frame.dataset.readyScene=select.value;play.disabled=false;status.textContent=variant==='legacy'?'修正前：移動中も視点が回り、指を離すと移動の基準が変わります。':variant==='hybrid'?'修正版：画面の方向へ移動。移動中は方角を保ち、十分に止まってから視点を調整します。手前の壁・屋根は足元の周囲だけ切り欠きます。':'固定視点：方角は一定。見通しが悪い場所では距離と見下ろし角度を調整します。';
}
const reload=()=>load().catch(e=>status.textContent=e.message);
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;reload()});select.onchange=reload;
play.onclick=()=>{if(!active)return;active.__hold=false;frame.focus();play.disabled=true;status.textContent='敵と記録送信を止めた比較用プレイです。移動・ジャンプで足場を確認できます。'};reload();
</script></html>
