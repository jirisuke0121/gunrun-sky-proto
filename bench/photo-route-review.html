<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赤線ルートの実画面確認</title><style>body{margin:0;background:#15232c;color:#eaf5ed;font:14px system-ui}header{padding:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,input{font:inherit;padding:7px;background:#29414a;color:white;border:1px solid #89a6a5;border-radius:5px}input{width:66px}iframe{width:100%;height:76vh;border:0}output{display:block;padding:10px;white-space:pre-wrap;font:12px monospace}label{white-space:nowrap}</style><header><button data-preset="tower">写真1：東塔の足元</button><button data-preset="north">写真2：北の下段</button><button data-preset="southAdded">既存⑤</button><button data-preset="northAdded">既存⑥</button><label>X <input id="x" type="number" step=".1" value="45"></label><label>Y <input id="y" type="number" step=".1" value="0"></label><label>Z <input id="z" type="number" step=".1" value="-13"></label><label>向き° <input id="yaw" type="number" step="5" value="135"></label><label>上下° <input id="pitch" type="number" step="5" value="0"></label><button id="place">この位置で表示</button><button id="left">左15°</button><button id="right">右15°</button><button id="run">2経路を実測</button></header><iframe id="game" title="実マップの確認画面" sandbox="allow-same-origin allow-scripts"></iframe><output id="out">読み込み中。この確認画面はプレイ記録・設定を保存しません。</output><script type="module">
const el=id=>document.getElementById(id),frame=el('game'),out=el('out');let w,g,s,ready=false,before=false;
const presets={tower:[45,0,-13,135,0],north:[12,0,-15.5,130,0],southAdded:[-2,4,17,90,0],northAdded:[2,4,-15.5,90,0]};
function show(){if(!ready)return;g.placeAt({x:+el('x').value,y:+el('y').value+.001,z:+el('z').value,yaw:+el('yaw').value*Math.PI/180});g.P.pitch=+el('pitch').value*Math.PI/180;g.frameOnce(1/120);out.textContent=JSON.stringify({position:g.P.pos.toArray(),bodyFree:g.freeAt(g.P.pos.x,g.P.pos.y+.03,g.P.pos.z,.32,1.75),roofDistance:Math.round(Math.hypot(g.P.pos.x+11,g.P.pos.y-8,g.P.pos.z)),northGoalDistance:Math.round(Math.hypot(g.P.pos.x-4,g.P.pos.y,g.P.pos.z+24)),before},null,2);}
for(const button of document.querySelectorAll('[data-preset]'))button.onclick=()=>{presets[button.dataset.preset].forEach((v,i)=>el(['x','y','z','yaw','pitch'][i]).value=v);show();};
el('run').onclick=async()=>{out.textContent='実ゲームの経路を確認中…';try{let url=new URL('./photo-route-scenario.js',location.href).href;const ref=new URLSearchParams(location.search).get('ref');if(ref)url=URL.createObjectURL(new Blob([await fetch('https://raw.githubusercontent.com/jirisuke0121/gunrun-sky-proto/'+ref+'/bench/photo-route-scenario.js').then(r=>{if(!r.ok)throw Error('シナリオ取得 '+r.status);return r.text()})],{type:'text/javascript'}));const m=await import(url+'#'+Date.now());out.textContent=JSON.stringify(await m.run(w),null,2)}catch(e){out.textContent=e.stack}};
el('place').onclick=show;el('left').onclick=()=>{el('yaw').value=+el('yaw').value+15;show();};el('right').onclick=()=>{el('yaw').value=+el('yaw').value-15;show();};


async function boot(){ready=false;out.textContent='ゲームとモデルを読み込み中…';const base=new URL('../',location.href).href;let source=await fetch(new URL('index.html',base),{cache:'no-store'}).then(r=>r.text());
const ref=new URLSearchParams(location.search).get('ref');if(ref){if(!/^[a-zA-Z0-9_/-]+$/.test(ref)||ref.includes('..'))throw Error('invalid ref');for(const file of ['old-town-swing.js','town-heights.js']){const code=await fetch('https://raw.githubusercontent.com/jirisuke0121/gunrun-sky-proto/'+ref+'/'+file,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(file+' '+r.status);return r.text()});source=source.replace(new RegExp('<script src="\\./'+file+'[^"]*"><'+'/script>'),()=>'<script>'+code+'<'+'/script>');}}
const guard=`<base href="${base}"><script>window.__hold=true;const oldFetch=window.fetch.bind(window);window.fetch=(url,options)=>/gunrun-runs\\./.test(String(url))?Promise.resolve(new Response('{}',{status:200})):oldFetch(url,options);Storage.prototype.setItem=()=>{};Storage.prototype.removeItem=()=>{};Storage.prototype.clear=()=>{};${before?`addEventListener('load',()=>{});`:''}<\/script>`;
const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.srcdoc=source.replace('<head>',`<head>${guard}`);await loaded;w=frame.contentWindow;
for(let i=0;i<600&&(!w.__game||!w.skyHumanView);i++)await new Promise(r=>setTimeout(r,50));g=w.__game;s=w.__skyInternals;if(!g)throw Error('ゲーム本体が起動しません');g.S.sendLog=false;
for(let i=0;i<600&&w.document.body.dataset.skyHumanLoaded!=='true';i++)await new Promise(r=>setTimeout(r,50));g.startGame();g.S.sendLog=false;g.SCR.off=g.PACE.off=g.MARK.off=true;g.GAME.spawnT=g.GAME.surgeT=1e9;g.GAME.over=false;g.zombies.forEach(z=>s.ue.remove(z.m.root));g.zombies.length=0;g.P.invuln=1e9;ready=true;show();}
boot().catch(e=>out.textContent=e.stack);
</script></html>
