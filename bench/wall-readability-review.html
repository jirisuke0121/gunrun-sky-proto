<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>壁と床の見分け方を比較</title>
<style>body{margin:0;background:#17232b;color:#edf1ef;font:15px system-ui}header{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 16px 0 0}button,select{font:inherit;color:inherit;background:#30434e;border:1px solid #8caaac;border-radius:6px;padding:9px 14px}button[aria-pressed=true]{background:#bce1cd;color:#132b21}p{margin:0;padding:0 16px 12px;color:#bdcccf}iframe{display:block;width:100%;height:calc(100vh - 125px);border:0;min-height:390px}</style>
<header><h1>壁と床の見分け方</h1><button data-variant="classic" aria-pressed="false">変更前</button><button data-variant="revised" aria-pressed="true">変更後</button><select id="scene" aria-label="場所"><option value="south">写真2の壁・階段</option><option value="west">写真1の箱付近</option></select><button id="play" disabled>ここから遊ぶ</button></header><p id="status">比較画面を読み込み中…</p><iframe id="game" title="実ゲームで変更前後を比較"></iframe>
<script type="module">
const frame=document.querySelector('#game'),status=document.querySelector('#status'),play=document.querySelector('#play');let variant='revised',generation=0,active;
const pause=()=>new Promise(r=>setTimeout(r,50));
async function load(){const gen=++generation;play.disabled=true;active=null;status.textContent='比較画面を読み込み中…';
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));
 const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.src='../index.html?camera=after&cameraTrial=fixed&wallReadability='+variant+'&onboarding=0&controlpick=0&hookGuide=0&dev=1&lang=ja';await loaded;
 const w=frame.contentWindow;w.__hold=true;
 for(let i=0;i<2400&&!w.skyStartReadiness?.ready;i++){if(gen!==generation)return;await pause();}
 if(gen!==generation)return;if(!w.skyStartReadiness?.ready)throw Error('読み込みを完了できませんでした。再読み込みしてください。');
 await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));w.document.getElementById('bStart').click();const g=w.__game;g.S.sendLog=g.S.autoFire=false;g.GAME.spawnT=g.GAME.surgeT=Infinity;g.SCR.off=g.PACE.off=g.MARK.off=true;
 for(const z of g.zombies){w.__skyInternals.ue.remove(z.m.root);if(z.pool)w.__skyInternals.ue.remove(z.pool)}g.zombies.length=0;g.P.invuln=Infinity;
 const at=document.querySelector('#scene').value==='south'?[-5,6,18]:[-28,0,10];w.skySwing.reset();g.P.pos.set(...at);g.P.lastGround.copy(g.P.pos);g.P.safe.copy(g.P.pos);g.P.vel.set(0,0,0);g.P.state='normal';g.P.onGround=true;g.P.yaw=g.P.pitch=0;w.skyFollowCamera.reset();g.frameOnce(0);active=w;play.disabled=false;
 status.textContent='同じ場所・同じ視点です。壁の横積み、床の目地、足場の縁を比べてください。';}
function reload(){load().catch(e=>status.textContent=e.message)}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;reload()});document.querySelector('#scene').onchange=reload;
play.onclick=()=>{if(!active)return;const g=active.__game;if(document.querySelector('#scene').value==='south')g.P.pos.set(-2,4.001,17);g.P.lastGround.copy(g.P.pos);g.P.safe.copy(g.P.pos);g.P.vel.set(0,0,0);g.P.onGround=true;active.__hold=false;frame.focus();play.disabled=true;status.textContent='比較用に敵と記録送信を止めています。移動・ジャンプで足場を確認できます。';};reload();
</script></html>
