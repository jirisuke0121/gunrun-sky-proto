<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カメラ Before / After | 空中回廊</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#252a30;color:#f6eedc;font:14px/1.5 system-ui,sans-serif}header{padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0 12px 0 0;font-size:18px}button,select,a{font:inherit}button,select{min-height:44px;padding:8px 14px;border:1px solid #9c9079;border-radius:7px;background:#3b424b;color:inherit}button[aria-pressed=true]{background:#e9c77c;color:#24272c;border-color:#e9c77c;font-weight:750}a{color:#f6d58e}p{margin:0;padding:0 16px 10px;color:#d4d1c9;font-size:12px}iframe{display:block;width:100%;height:0;flex:1;min-height:180px;border:0;background:#d9ccab}.open{margin-left:auto}footer{padding:8px 16px;font-size:12px;color:#c5c8cc}@media(max-width:600px){header{gap:6px;padding:8px}h1{width:100%;font-size:16px}button,select{padding:7px 10px}.open{margin-left:0}iframe{height:0}}
</style>
<header>
  <h1>空中回廊 · カメラ比較</h1>
  <button type="button" id="before" aria-pressed="false">Before：従来操作</button>
  <button type="button" id="after" aria-pressed="true">After：移動に追従</button>
  <select id="map" aria-label="比較するマップ"><option value="canyon.html?practice=1">練習場（追手なし）</option><option value="index.html">旧市街</option><option value="canyon.html">岩壁渓谷</option></select>
  <a id="open" class="open" href="./canyon.html?practice=1&camera=after" target="_blank" rel="noopener">ゲームを大きく開く ↗</a>
</header>
<p id="guide">After：左スティックの左右で曲がる。右側は見回したいときだけ操作。PCはW/Sで前後、A/Dで旋回、Alt＋A/Dで横移動。</p>
<iframe id="game" title="カメラを比較するゲーム" src="./canyon.html?practice=1&camera=after" allow="fullscreen; autoplay"></iframe>
<footer>同じ場所でBefore／Afterを切り替えられます。Beforeを選ぶと従来の移動・視点操作へ戻ります。</footer>
<script>
let mode='after';
const frame=document.getElementById('game'),map=document.getElementById('map'),open=document.getElementById('open');
function link(){const url=new URL(map.value,location.href);url.searchParams.set('camera',mode);open.href=url.href;return url.href;}
function choose(next){
  mode=next;
  document.getElementById('before').setAttribute('aria-pressed',String(mode==='before'));
  document.getElementById('after').setAttribute('aria-pressed',String(mode==='after'));
  document.getElementById('guide').textContent=mode==='before'?'Before：左側は前後・横移動、右側は視点操作。PCはWASDで移動、マウスで視点操作。':'After：左スティックの左右で曲がる。右側は見回したいときだけ操作。PCはW/Sで前後、A/Dで旋回、Alt＋A/Dで横移動。';
  link();frame.contentWindow.skyFollowCamera?.setMode(mode);
  frame.contentWindow.document.getElementById('c')?.focus();
}
document.getElementById('before').addEventListener('click',()=>choose('before'));
document.getElementById('after').addEventListener('click',()=>choose('after'));
map.addEventListener('change',()=>frame.src=link());
frame.addEventListener('load',()=>frame.contentWindow.skyFollowCamera?.setMode(mode,false));
</script>
</html>
